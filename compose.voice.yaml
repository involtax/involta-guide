# Local Voice uses the same DATABASE_URL as Guide, schema voice and its audio volume.
# Use a digest-qualified VOICE_IMAGE for a reviewed deployment; no production workflow changes.
services:
  voice-migrate:
    image: ${VOICE_IMAGE:-involta-voice:local}
    build: .
    env_file: ["${VOICE_ENV_FILE:-.env.voice}", "${GUIDE_ENV_FILE:-.env.local}"]
    command: [voice, migrate]
    restart: "no"
  voice:
    stop_grace_period: 90s
    image: ${VOICE_IMAGE:-involta-voice:local}
    build: .
    env_file: ["${VOICE_ENV_FILE:-.env.voice}", "${GUIDE_ENV_FILE:-.env.local}"]
    environment:
      VOICE_URL: http://127.0.0.1:3100
      VOICE_DATA_DIR: /app/var/voice
    command: [uvicorn, "involta_guide.infrastructure.voice.runtime:create_app", --factory, --host, "0.0.0.0", --port, "3100", --no-access-log, --no-proxy-headers, --timeout-graceful-shutdown, "15"]
    ports: ["127.0.0.1:3100:3100"]
    volumes: [voice-audio:/app/var/voice]
    depends_on:
      voice-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:3100/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    init: true
    restart: unless-stopped
  voice-worker:
    image: ${VOICE_IMAGE:-involta-voice:local}
    env_file: ["${VOICE_ENV_FILE:-.env.voice}", "${GUIDE_ENV_FILE:-.env.local}"]
    environment:
      VOICE_DATA_DIR: /app/var/voice
      VOICE_HEARTBEAT_FILE: /tmp/involta-voice-worker
      VOICE_ASR_MODELS_DIR: /app/var/asr-models
    command: [voice-worker]
    # Offline serving: weights must be prepared before worker startup.
    stop_grace_period: 120s
    volumes: [voice-audio:/app/var/voice, asr-models:/app/var/asr-models:ro]
    depends_on:
      voice-prepare-model:
        condition: service_completed_successfully
      voice-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, voice, worker-health]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    restart: unless-stopped
  voice-prepare-model:
    image: ${VOICE_IMAGE:-involta-voice:local}
    env_file: ["${VOICE_ENV_FILE:-.env.voice}", "${GUIDE_ENV_FILE:-.env.local}"]
    environment:
      VOICE_ASR_MODELS_DIR: /app/var/asr-models
      HF_HOME: /tmp/huggingface
      HF_HUB_DISABLE_XET: "1"
    command: [voice, prepare-model]
    volumes: [asr-models:/app/var/asr-models]
    restart: "no"
volumes:
  voice-audio:
  asr-models:
