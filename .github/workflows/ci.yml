name: Test and publish SHA image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Only obsolete PR checks can be cancelled. Main publication is never cancelled.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      image: ${{ steps.revision.outputs.image }}
      image_id: ${{ steps.identity.outputs.image_id }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guide_test
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: guide_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guide_test -d guide_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://guide_test:ci-only-ephemeral-password@127.0.0.1:5432/guide_test
      DATABASE_URL: postgresql://guide_test:ci-only-ephemeral-password@127.0.0.1:5432/guide_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        name: Resolve and validate immutable revision
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          printf 'sha=%s\nimage=ghcr.io/%s\n' "$sha" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Select required test profile from the complete change set
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/ci_plan.py
      - uses: docker/setup-buildx-action@v3
      - name: Build cached test environment
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          platforms: linux/amd64
          provenance: false
          tags: involta-guide:test
          cache-from: |
            type=gha,scope=test-linux-amd64
            type=gha,scope=production-linux-amd64
          cache-to: type=gha,scope=test-linux-amd64,mode=max,ignore-error=true
      - run: deploy/test-container.sh ruff check src tests migrations deploy
      - run: deploy/test-container.sh ruff format --check src tests migrations deploy
      - run: deploy/test-container.sh mypy
      - name: Run isolated test groups in parallel
        env:
          TEST_PROFILE: ${{ steps.plan.outputs.profile }}
        run: deploy/test-container.sh python deploy/run_tests.py --profile "$TEST_PROFILE"
      - id: build
        name: Build the production image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          provenance: false
          tags: |
            involta-guide:ci
            ${{ steps.revision.outputs.image }}:${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=production-linux-amd64
            type=gha,scope=test-linux-amd64
          cache-to: type=gha,scope=production-linux-amd64,mode=max,ignore-error=true
      - id: identity
        name: Record the exact image that will be tested
        run: echo "image_id=$(docker image inspect --format '{{.Id}}' involta-guide:ci)" >> "$GITHUB_OUTPUT"
      - name: Verify installed code, resources and runtime
        run: deploy/test-container.sh python tests/deployment/image_smoke.py
      - name: Verify current-state cutover and real database rollback
        if: steps.plan.outputs.profile == 'full'
        run: deploy/test-container.sh python tests/deployment/current_state_smoke.py
      - name: Verify combined Voice and shared database
        run: deploy/test-container.sh python tests/deployment/voice_stack_smoke.py
        env:
          VOICE_TEST_IMAGE: involta-guide:ci
      - name: Validate generated routes with real nginx
        if: steps.plan.outputs.profile == 'full'
        run: deploy/test-container.sh python tests/deployment/nginx_smoke.py
      - name: Check deployment shell scripts
        if: steps.plan.outputs.profile == 'full'
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning deploy/*.sh
      - run: deploy/test-container.sh python -m compileall -q deploy
      - name: Validate workflows
        if: steps.plan.outputs.profile == 'full'
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate production Compose files
        if: steps.plan.outputs.profile == 'full'
        env:
          IMAGE_REF: ghcr.io/involtax/involta-guide@sha256:1111111111111111111111111111111111111111111111111111111111111111
          POSTGRES_IMAGE: postgres@sha256:2222222222222222222222222222222222222222222222222222222222222222
          RELEASE_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          VOICE_SERVICE_SECRET: ci-only-voice-secret-with-at-least-32-characters
          OPENAI_API_KEY: ci-fake-key-never-used
          DEPLOY_ROOT: /tmp/guide-compose-check
          AUDIO_VOLUME: guide-test-audio
          NGINX_NETWORK: guide-test-network
        run: |
          mkdir -p "$DEPLOY_ROOT"
          touch "$DEPLOY_ROOT/.env.production" "$DEPLOY_ROOT/.env.database" "$DEPLOY_ROOT/.env.voice"
          for file in deploy/compose*.yaml; do
            case "$file" in deploy/compose.voice*) continue ;; esac
            docker compose -f "$file" config --quiet
          done
          docker compose -f deploy/compose.production.yaml -f deploy/compose.voice.yaml config --quiet
          docker compose -f deploy/compose.host.yaml -f deploy/compose.voice.host.yaml config --quiet
      - name: Export the verified image without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.revision.outputs.image }}:${{ steps.revision.outputs.sha }}
          TESTED_IMAGE_ID: ${{ steps.identity.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE")" == "$TESTED_IMAGE_ID" ]]
          docker image save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/production-image.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: verified-image-${{ steps.revision.outputs.sha }}
          path: ${{ runner.temp }}/production-image.tar.gz
          compression-level: 0
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            var/test-results/summary.json
            var/test-results/*/pytest.log
            var/test-results/*/junit.xml
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: var/screenshots/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    concurrency:
      group: ghcr-${{ needs.verify.outputs.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ needs.verify.outputs.sha }}
          path: ${{ runner.temp }}/verified-image
      - name: Load the verified image
        run: docker image load --input "$RUNNER_TEMP/verified-image/production-image.tar.gz"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish exactly the tested image
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          SHA: ${{ needs.verify.outputs.sha }}
          TESTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
        run: python3 deploy/publish-image.py "$IMAGE" "$SHA" "$TESTED_IMAGE_ID"
      - name: Publication summary
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          SHA: ${{ needs.verify.outputs.sha }}
          TESTED_IMAGE_ID: ${{ needs.verify.outputs.image_id }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo "Commit: $SHA"
            echo "Tested and published image ID: $TESTED_IMAGE_ID"
            echo "Production reference: $IMAGE@$DIGEST"
            echo "Publication loaded the tested artifact; no second build."
          } >> "$GITHUB_STEP_SUMMARY"
