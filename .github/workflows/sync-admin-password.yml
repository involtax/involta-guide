name: Sync production admin password
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: involta-guide-production
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update password over SSH and verify it without logging credentials
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SYNC_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash deploy/ssh-release.sh admin-password
