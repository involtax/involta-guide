name: Recover production cutover
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: involta-guide-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    permissions:
      contents: read
      packages: read
    env:
      TARGET_SHA: dbe6828f155e5479f91d5ab267b94942ca46b65e
      IMAGE_REF: ghcr.io/involtax/involta-guide@sha256:5de513ef270f70e8374d6dd56efeecc1516fbbc6e90c0e4db83011207801ee2f
      RECOVERY_DEPLOYMENT_ID: 41829897474-1
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_ROOT: /opt/involta-guide
      PUBLIC_URL: https://involta.ru/guide/
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore the failed cutover and verify the previous release
        run: bash deploy/ssh-release.sh recover
