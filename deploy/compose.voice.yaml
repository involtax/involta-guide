{
  "services": {
    "voice-migrate": {
      "image": "${IMAGE_REF:?}",
      "labels": {
        "com.involta.guide.owner": "production"
      },
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "voice-private",
        "frontend"
      ],
      "env_file": [
        "${DEPLOY_ROOT:?}/.env.production",
        "${DEPLOY_ROOT:?}/.env.voice"
      ],
      "environment": {
        "OPENAI_API_KEY": "${OPENAI_API_KEY:-}",
        "VOICE_SERVICE_SECRET": "${VOICE_SERVICE_SECRET:?}",
        "VOICE_DATA_DIR": "/app/var/voice"
      },
      "volumes": [
        "voice-audio:/app/var/voice"
      ],
      "command": [
        "voice",
        "migrate"
      ],
      "depends_on": {}
    },
    "voice-worker": {
      "image": "${IMAGE_REF:?}",
      "labels": {
        "com.involta.guide.owner": "production"
      },
      "restart": "unless-stopped",
      "read_only": true,
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "voice-private",
        "frontend"
      ],
      "env_file": [
        "${DEPLOY_ROOT:?}/.env.production",
        "${DEPLOY_ROOT:?}/.env.voice"
      ],
      "environment": {
        "OPENAI_API_KEY": "${OPENAI_API_KEY:-}",
        "VOICE_SERVICE_SECRET": "${VOICE_SERVICE_SECRET:?}",
        "VOICE_DATA_DIR": "/app/var/voice",
        "VOICE_ASR_MODELS_DIR": "/app/var/asr-models",
        "HF_HOME": "/tmp/huggingface",
        "HF_HUB_OFFLINE": "1",
        "VOICE_ASR_BETA_ENABLED": "true"
      },
      "volumes": [
        "voice-audio:/app/var/voice",
        "asr-models:/app/var/asr-models:ro"
      ],
      "command": [
        "voice-worker"
      ],
      "stop_grace_period": "120s",
      "depends_on": {
        "voice-migrate": {
          "condition": "service_completed_successfully"
        },
        "voice-prepare-model": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "voice",
          "worker-health"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 4
      },
      "mem_limit": "3g",
      "cpus": 1.5,
      "init": true
    },
    "web": {
      "environment": {
        "VOICE_URL": "http://voice:3100"
      },
      "networks": [
        "frontend",
        "voice-private"
      ]
    },
    "voice-prepare-model": {
      "image": "${IMAGE_REF:?}",
      "labels": {
        "com.involta.guide.owner": "production"
      },
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "voice-private",
        "frontend"
      ],
      "env_file": [
        "${DEPLOY_ROOT:?}/.env.production",
        "${DEPLOY_ROOT:?}/.env.voice"
      ],
      "environment": {
        "OPENAI_API_KEY": "${OPENAI_API_KEY:-}",
        "VOICE_SERVICE_SECRET": "${VOICE_SERVICE_SECRET:?}",
        "VOICE_DATA_DIR": "/app/var/voice",
        "VOICE_ASR_MODELS_DIR": "/app/var/asr-models",
        "HF_HOME": "/tmp/huggingface",
        "HF_HUB_DISABLE_XET": "1",
        "VOICE_ASR_BETA_ENABLED": "true"
      },
      "volumes": [
        "asr-models:/app/var/asr-models"
      ],
      "command": [
        "voice",
        "prepare-model"
      ],
      "depends_on": {}
    },
    "voice": {
      "image": "${IMAGE_REF:?}",
      "labels": {
        "com.involta.guide.owner": "production"
      },
      "restart": "unless-stopped",
      "read_only": true,
      "tmpfs": [
        "/tmp:mode=1777"
      ],
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "frontend",
        "voice-private"
      ],
      "env_file": [
        "${DEPLOY_ROOT:?}/.env.production",
        "${DEPLOY_ROOT:?}/.env.voice"
      ],
      "environment": {
        "OPENAI_API_KEY": "${OPENAI_API_KEY:-}",
        "VOICE_SERVICE_SECRET": "${VOICE_SERVICE_SECRET:?}",
        "VOICE_DATA_DIR": "/app/var/voice",
        "VOICE_URL": "http://127.0.0.1:3100",
        "VOICE_ASR_BETA_ENABLED": "true"
      },
      "volumes": [
        "voice-audio:/app/var/voice"
      ],
      "command": [
        "uvicorn",
        "involta_guide.infrastructure.voice.runtime:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "3100",
        "--no-access-log",
        "--no-proxy-headers",
        "--timeout-graceful-shutdown",
        "15"
      ],
      "depends_on": {
        "voice-migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:3100/health/ready',timeout=3)\" && guide voice-consumer-health"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "15s"
      },
      "init": true,
      "stop_grace_period": "90s"
    }
  },
  "volumes": {
    "voice-audio": {},
    "asr-models": {}
  },
  "networks": {
    "voice-private": {
      "internal": true
    }
  }
}
