# Include inside the existing server { server_name involta.ru; ... }.
# Use the actual container DNS name/port if it differs from involta-guide:3000.
# No trailing slash in proxy_pass: /guide must reach Next.js unchanged.
location = /guide {
    access_log off;
    return 302 /guide/$is_args$args;
}
location ^~ /guide/ {
    proxy_pass http://involta-guide:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 240s;
    client_max_body_size 11m;
    access_log off;
    proxy_hide_header X-Powered-By;
}
