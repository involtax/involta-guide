    #guide-vip-header-preview .guide-level { text-transform: uppercase; font-size: 10px; letter-spacing: 0.7px; }
    #guide-vip-header-preview .guide-crown {
      position: absolute;
      right: -6px;
      top: -5px;
      display: block;
      width: var(--guide-crown-size);
      height: var(--guide-crown-size);
      transform: rotate(var(--guide-crown-angle));
      color: var(--guide-preview-gold);
      pointer-events: none;
    }
    #guide-vip-header-preview .guide-crown svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 1.6px;
      stroke-linejoin: round;
    }
    #guide-vip-header-preview .guide-page {

      font-weight: 400;
      font-style: italic;
      letter-spacing: -2.5px;
    }

</div></body></html>
