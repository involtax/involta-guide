const rows=structuredClone(seed).map((r,i)=>({...r,text:r.out.text,name:r.out.name,mentions:r.out.mentions,ip:'192.0.2.'+(10+i),ua:i%2?'Mozilla/5.0 (Linux; Android 15; Pixel 9) Chrome/130 Mobile':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_1 like Mac OS X) Version/18.1 Mobile Safari/604.1'}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vote=v=>v===1?'+1':v===-1?'−1':'без оценки';
function notify(message){clearTimeout(timer);const t=document.querySelector('#toast');t.textContent=message;t.hidden=false;timer=setTimeout(()=>t.hidden=true,3500)}
function render(){document.querySelector('#filters').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="filter ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}">${v}<span class="count">${rows.filter(r=>!r.deleted&&r.status===k).length}</span></button>`).join('');const visible=rows.filter(r=>!r.deleted&&r.status===filter).sort((a,b)=>Date.parse(b.time)-Date.parse(a.time)||b.id-a.id);document.querySelector('#feed').innerHTML=visible.length?visible.map(card).join(''):'<div class="empty">Здесь пока нет отзывов.</div>'}
function card(r){const date=new Date(r.time).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});return `<article class="card" data-review="${r.id}"><div class="cardhead"><div><span class="id">${esc(r.city)} / ${r.id}</span><time class="date" datetime="${r.time}">${date} · UTC+3</time></div><span class="ai-label">ИИ: ${labels[r.out.status]}</span></div><div class="before"><span class="text-label">До · итоговая расшифровка</span><p>${esc(r.source)}</p></div><div class="after"><span class="text-label">После · обработка ИИ</span><p class="review">${esc(r.text)}</p></div>${r.out.status==='ok'?`<div class="attributes"><div><span class="label">Имя</span>${esc(r.name)||'Не названо'}</div><div><span class="label">Рестораны</span>${r.mentions.length?r.mentions.map(([id,v,name])=>`<span class="chip">${esc(catalog[id]?.name||name)} · ${id?vote(v):'не сопоставлено'}</span>`).join(''):'Не упомянуты'}</div></div>`:''}<div class="meta">IP ${esc(r.ip)}<br>UA ${esc(r.ua)}</div><div class="actions">${r.status==='new'?`<button class="approve" data-action="approve" data-id="${r.id}">ОК</button>`:''}<button class="link delete" data-action="delete" data-id="${r.id}">Удалить</button></div></article>`}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const a=e.target.closest('[data-action]');if(!a)return;const r=rows.find(r=>r.id===Number(a.dataset.id));if(!r||r.deleted)return;if(a.dataset.action==='approve'){r.status=r.out.status;notify('Подтверждено · '+labels[r.status])}else{r.deleted=true;notify('Отзыв удалён из демо')}render()});render();
