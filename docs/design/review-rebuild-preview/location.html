<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отзывы — предложение</title><style>:root{--line:#dededb;--black:#171717;--muted:#747474}*{box-sizing:border-box}body{margin:0;background:white;color:var(--black);font-family:Arial,sans-serif}main{max-width:908px;margin:36px auto;padding:0 24px}h2{font-size:28px;letter-spacing:-.8px;font-weight:500;margin:0 0 8px}em{font-family:Georgia,serif;font-weight:400}.label{font-size:11px;color:var(--muted);margin:0 0 28px}.home-reviews{max-width:860px;border-top:1px solid var(--line);padding-top:28px;margin-bottom:70px}
.home-reviews .section-heading{margin-bottom:8px;gap:16px}
.home-review{display:block;padding:25px 0 27px;border-bottom:1px solid var(--line)}
.home-review-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:16px}
.home-review-city{justify-self:start;min-width:0;overflow-wrap:anywhere;font:italic 19px/1.4 Georgia,'Times New Roman',serif;letter-spacing:-.015em;color:var(--black);text-decoration:underline;text-decoration-color:#d8d8d1;text-decoration-thickness:1px;text-underline-offset:5px}
.home-review-city-arrow{display:inline-block;margin-left:8px;font:14px/1 Arial,sans-serif;color:#8a8a84;transition:transform 140ms ease}
.home-review time{justify-self:end;text-align:right;font-size:12px;line-height:1.7;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.home-review p{font-size:17px;line-height:1.65;margin:12px 0 0;max-width:760px;color:var(--black);white-space:pre-wrap;overflow-wrap:anywhere}
.home-review:hover{opacity:1}.home-review:hover .home-review-city{text-decoration-color:#888}.home-review:hover .home-review-city-arrow{transform:translateX(3px)}
@media(prefers-reduced-motion:reduce){.home-review-city-arrow{transition:none}}

.home-page .search-hero > .eyebrow { text-transform:none; }
.home-review:last-child { border-bottom:0; }
.home-page + footer { border-top:0; }
.home-reviews-empty { padding:18px 0;color:var(--muted); }
@media(max-width:650px){.home-reviews{padding-top:24px;margin-bottom:48px}.home-review{padding:23px 0 25px}.home-review-meta{gap:12px}.home-review-city{font-size:17px}.home-review-city-arrow{font-size:12px;margin-left:6px}.home-review time{font-size:11px}.home-review p{font-size:16px;margin-top:11px}}
.home-reviews{border:0;margin:0;padding:0}.home-review-city{text-decoration:none}.nearby{border-top:1px solid var(--line);padding:28px 0}.places{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}.places strong{font-size:23px;font-weight:400}.places small{display:block;color:var(--muted);margin-top:8px}.home-review-meta:has(.home-review-city:empty){grid-template-columns:1fr}.home-review p{margin-top:12px}@media(max-width:650px){main{margin-top:28px}.places{grid-template-columns:1fr}h2{font-size:26px}}</style><main><p class="label">МАКЕТ · ТЕКСТЫ И ИМЯ ДЕМОНСТРАЦИОННЫЕ</p><section class="home-reviews"><h2>Отзывы</h2><div class="home-reviews-list"><article class="home-review"><div class="home-review-meta"><span class="home-review-city">Алекс</span><time>6 нояб. · 23:05</time></div><p>Был сегодня в Огоньке. Очень вкусно, обязательно вернусь.</p></article><article class="home-review"><div class="home-review-meta"><span class="home-review-city"></span><time>6 нояб. · 21:40</time></div><p>А ещё загляните в Хикари — понравилась кухня и спокойная атмосфера.</p></article></div></section><section class="nearby"><h2>А еще рядом <em>есть</em></h2><div class="places"><div><strong>Плёс →</strong><small>Ивановская область</small></div><div><strong>Шуя →</strong><small>Ивановская область</small></div></div></section></main></html>
