{%from 'macros.html' import csrf with context%}
<section id="job-list" hx-get="{{settings.path('/admin/jobs')}}" hx-trigger="every 15s" hx-target="this" hx-select="unset" hx-swap="outerHTML">
<h2>Очередь</h2>
{%for j in jobs%}
<article class="panel">
<strong>{{j.kind}} · {{j.status}}</strong>
<p>{{j.location_id}} · попыток {{j.attempts}} · {{j.error or ''}}</p>
<a href="{{settings.path('/admin')}}?tab=ai-audit&amp;job={{j.id}}">Запросы, ответы и подробный журнал ↗</a>
{%if j.status=='failed'%}
<form method="post" action="{{settings.path('/admin/actions/retry')}}" hx-target="#admin-main" hx-select="#admin-main" hx-swap="outerHTML">{{csrf()}}<input type="hidden" name="job_id" value="{{j.id}}">
<button>Повторить</button>
</form>
{%endif%}
</article>
{%endfor%}
</section>
