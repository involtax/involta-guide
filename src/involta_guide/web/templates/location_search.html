<form class="destination-search" action="{{search_action}}" method="{{search_method|default('get')}}" role="search" data-location-search data-catalogue-url="{{settings.path('/api/locations/catalogue')}}" {%if search_add|default(false)%}data-location-add{%endif%}>
{%if search_add|default(false)%}{{csrf()}}<input type="hidden" name="nearby_id" value="">{%endif%}
<label for="destination" {%if search_label_hidden|default(false)%}class="sr-only"{%endif%}>{{search_label|default("Куда отправимся?")}}</label>
<div class="search-control">
<div class="search-surface">
<div class="search-input-row">
<svg class="search-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
<input id="destination" type="search" name="q" value="{{search_query|default(q)}}" maxlength="100" placeholder="Город, район, курорт" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-describedby="search-status">
<button type="button" class="search-clear" aria-label="Очистить поиск" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<button type="submit" class="search-submit">Найти</button>
</div>
<div class="search-suggestions" hidden inert aria-hidden="true">
<div class="search-panel-content">
<div class="search-separator" aria-hidden="true"></div>
</div>
</div>
</div>
</div>
{%if search_add|default(false)%}<script type="application/json" id="location-catalogue">{{location_catalogue|tojson}}</script>{%endif%}
<p id="search-status" role="status" aria-live="polite" class="sr-only"></p>
</form>
