<div class="review-player" id="review-player-{{review.number}}" hx-preserve="true">
<audio controls controlslist="nodownload noplaybackrate noremoteplayback" disableremoteplayback preload="metadata" aria-label="Аудио отзыва № {{review.number}}" src="{{settings.path(review.log_path+'/audio')+'?playback=true'}}"></audio>
<div class="review-player-controls" hidden>
<button type="button" class="review-play" aria-label="Воспроизвести отзыв № {{review.number}}">
<svg data-play-icon viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3L17 10L5 17Z"/></svg>
<svg data-pause-icon viewBox="0 0 20 20" aria-hidden="true" hidden><path d="M5 3H8V17H5ZM12 3H15V17H12Z"/></svg>
</button>
<input type="range" class="review-seek" min="0" max="1" step="0.01" value="0" disabled aria-label="Позиция воспроизведения отзыва № {{review.number}}">
<output class="review-time" aria-live="off">0:00 / --:--</output>
</div>
<p class="review-player-error" role="alert" hidden></p>
</div>
