{%extends 'base.html'%}
{%block body%}
<main>
<section class="panel">
<h1>Вход в редакцию</h1>
{%if message%}
<p role="alert" class="error">{{message}}</p>
{%endif%}
<form method="post" action="{{settings.path('/admin/login')}}" class="stack">
<input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Пароль редакции<input type="password" name="password" autocomplete="current-password" required>
</label>
<button>Войти ↗</button>
</form>
</section>
</main>
{%endblock%}
