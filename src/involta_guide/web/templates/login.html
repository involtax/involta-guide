{%extends 'admin_shell.html'%}
{%set message_role='alert'%}{%set show_admin_nav=false%}{%set show_admin_header=false%}{%set workspace_boost=false%}{%set workspace_class='admin-login'%}
{%block admin_content%}
<section class="panel">
<h1>Вход в редакцию</h1><p class="admin-muted">Управление локациями, ресторанами и отзывами.</p>
<form method="post" action="{{settings.path('/admin/login')}}" class="stack">
<input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Пароль редакции<input type="password" name="password" autocomplete="current-password" required>
</label>
<button>Войти ↗</button>
</form>
</section>
{%endblock%}
