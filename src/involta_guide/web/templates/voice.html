<section class="voice-section" id="review" data-voice-widget data-location-id="{{location.id}}" data-api-base="{{settings.path('/api')}}" data-csrf="{{voice_csrf}}">
<div>
<p class="eyebrow">ВАШ ГОЛОС В ГИДЕ</p>
<h2>Были здесь?<br>
<span class="serif">Расскажите.</span>
</h2>
<p>Хороший ужин, неудачный опыт или место, которого не хватает в подборке {{location.name}}? Нажмите кнопку и расскажите голосом. Редакция услышит.</p>
<small>До 2 минут. {{'Команда применяется после распознавания.' if alex else 'Без регистрации.'}}</small>
</div>
<div class="recorder">
<div data-controls>
<button class="record-button" data-start>● Записать отзыв</button>
</div>
<p role="alert" class="error" data-error hidden>
</p>
<noscript>Для записи голоса включите JavaScript. Справочник доступен без него.</noscript>
</div>
<div class="my-reviews" data-history hidden>
</div>
</section>
